on:
  workflow_call:
    inputs:
      STRICT:
        required: false
        type: string
        default: "true"
      upload:
        required: false
        type: string
        default: "false"
      APP_BUILD:
        required: false
        type: string
        default: "v1"
    secrets:
      MAPBOX_DOWNLOADS_TOKEN:
        required: true
      PUBLIC_MAPBOX_TOKEN:
        required: false
      ANDROID_SIGNING_KEY:
        required: false
      ANDROID_KEY_STORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_SERVICE_ACCOUNT_JSON_TEXT:
        required: false
      SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      POSTHOG_API_KEY:
        required: false
      FEATURE_FLAG_SECRET:
        required: false

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    environment: ${{ ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'staging')) && 'production') || (startsWith(github.ref, 'refs/tags/v') && 'staging') }}
    env:
      STRICT: ${{ inputs.STRICT }}
      ENV: ${{ vars.ENV }}
      TERRASO_BACKEND: ${{ vars.TERRASO_BACKEND }}
      APP_BUILD: ${{ inputs.APP_BUILD }}
      GOOGLE_OAUTH_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_ANDROID_CLIENT_ID }}
      GOOGLE_OAUTH_IOS_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_IOS_CLIENT_ID }}
      GOOGLE_OAUTH_IOS_URI_SCHEME: ${{ vars.GOOGLE_OAUTH_IOS_URI_SCHEME }}
      MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
      MICROSOFT_SIGNATURE_HASH: ${{ vars.MICROSOFT_SIGNATURE_HASH }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ inputs.upload == 'false' && 'true' || 'false' }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      FEATURE_FLAG_URL: ${{ vars.FEATURE_FLAG_URL }}
      FEATURE_FLAG_SECRET: ${{ secrets.FEATURE_FLAG_SECRET }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      # The release AAB build intermittently OOM-killed the runner
      # ("hosted runner lost communication") during the R8/dex merge of our
      # ~48k classes (Gradle daemon at -Xmx6g, see app.config.ts) plus the
      # native C++ compile (dng-decoder + raw-camera NDK sources, built for
      # arm64-v8a AND armeabi-v7a, which runs OUTSIDE the JVM). The runner
      # has ~16 GB RAM (~14 GB free at build start), so a transient peak
      # that briefly exceeds available RAM is the suspected cause. Add a
      # 14 GB swapfile so that peak can spill to disk instead of tripping
      # the kernel OOM killer. The swapfile lives on the runner's root
      # filesystem (~98 GB free); /mnt is just a path on that disk, not a
      # separate volume. The resource monitor below records how much RAM
      # and swap the build actually uses so we can confirm the theory (and
      # decide later whether the 6g heap can safely shrink).
      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 14G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          swapon --show
          free -h

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
          cache-dependency-path: dev-client/package-lock.json

      - name: Install Node dependencies
        working-directory: dev-client
        run: npm ci

      - name: Generate android directory
        working-directory: dev-client
        run: npm run prebuild -- -p android

      - name: Set up our JDK environment
        uses: actions/setup-java@v5
        with:
          java-version-file: ".tool-versions"
          distribution: "temurin"
          cache: gradle

      # RN 0.83 / Expo SDK 56 asks for NDK 27.0.12077973 at build time.
      # The ubuntu-latest runner only preinstalls NDK 26, and Gradle's
      # auto-install via sdkmanager fails inside the build. Install it
      # explicitly here (this action also accepts SDK licences).
      - name: Install Android NDK 27
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;27.0.12077973"

      # Sample RAM + swap every 5s in the background so the post-build
      # report can show the PEAK the build actually hit (a one-shot free -h
      # afterwards would miss the transient spike we care about). This tells
      # us whether swap was really touched and how close to the ceiling the
      # 6g Gradle daemon plus the native compile actually get.
      - name: Start resource monitor
        run: |
          cat > /tmp/memmon.sh <<'EOF'
          #!/usr/bin/env bash
          peak_mem=0
          peak_swap=0
          while true; do
            read -r mem_used swap_used < <(free -m | awk '/^Mem:/{m=$3} /^Swap:/{s=$3} END{print m, s}')
            (( mem_used > peak_mem )) && peak_mem=$mem_used
            (( swap_used > peak_swap )) && peak_swap=$swap_used
            echo "$peak_mem" > /tmp/peak_mem
            echo "$peak_swap" > /tmp/peak_swap
            sleep 5
          done
          EOF
          chmod +x /tmp/memmon.sh
          nohup /tmp/memmon.sh >/tmp/memmon.log 2>&1 &
          echo $! > /tmp/memmon.pid

      - name: Build Android app bundle
        working-directory: ./dev-client/android
        run: ./gradlew bundleRelease

      # Runs even if the build fails, so an OOM run still reports what it hit.
      - name: Report peak RAM & swap usage
        if: always()
        run: |
          [ -f /tmp/memmon.pid ] && kill "$(cat /tmp/memmon.pid)" 2>/dev/null || true
          echo "Peak RAM used during build:  $(cat /tmp/peak_mem 2>/dev/null || echo '?') MiB"
          echo "Peak swap used during build: $(cat /tmp/peak_swap 2>/dev/null || echo '?') MiB"
          echo "--- free -h (now) ---"
          free -h
          echo "--- swapon --show (now) ---"
          swapon --show

      - name: Sign Android app bundle
        id: sign_app
        if: ${{ inputs.upload == 'true' }}
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ./dev-client/android/app/build/outputs/bundle/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ vars.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Upload App to Google Play
        if: ${{ inputs.upload == 'true' }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON_TEXT }}
          releaseName: "LandPKS Soil ID"
          packageName: org.terraso.landpks
          releaseFiles: ${{ steps.sign_app.outputs.signedFile }}
          tracks: internal
          status: draft
          inAppUpdatePriority: 2
