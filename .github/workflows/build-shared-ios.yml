on:
  workflow_call:
    inputs:
      STRICT:
        required: false
        type: string
        default: "true"
      upload:
        required: false
        type: string
        default: "false"
      APP_BUILD:
        required: false
        type: string
        default: "v1"
    secrets:
      MAPBOX_DOWNLOADS_TOKEN:
        required: true
      PUBLIC_MAPBOX_TOKEN:
        required: false
      APPLE_P12_BASE64:
        required: true
      APPLE_MOBILE_PROVISION_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ISSUER_ID:
        required: false
      APPLE_KEY_ID:
        required: false
      APPLE_APP_STORE_CONNECT_PRIVATE_KEY:
        required: false
      SENTRY_DSN:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      POSTHOG_API_KEY:
        required: false
      FEATURE_FLAG_SECRET:
        required: false
jobs:
  ios-build:
    name: iOS Build
    # xcode-27 = arm64 runner image with macOS 27 + Xcode 27 preinstalled.
    # Matches local dev on Xcode 27 / macOS Tahoe. SDK 57's expo-modules-jsi
    # RuntimeScheduler.h uses SWIFT_RETURNS_RETAINED annotations that Xcode
    # 26's clang rejects; Xcode 27's clang accepts them, so CI needs 27.
    runs-on: xcode-27
    environment: ${{ ((startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'staging')) && 'production') || (startsWith(github.ref, 'refs/tags/v') && 'staging') }}
    env:
      STRICT: ${{ inputs.STRICT }}
      ENV: ${{ vars.ENV }}
      TERRASO_BACKEND: ${{ vars.TERRASO_BACKEND }}
      APP_BUILD: ${{ inputs.APP_BUILD }}
      GOOGLE_OAUTH_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_ANDROID_CLIENT_ID }}
      GOOGLE_OAUTH_IOS_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_IOS_CLIENT_ID }}
      GOOGLE_OAUTH_IOS_URI_SCHEME: ${{ vars.GOOGLE_OAUTH_IOS_URI_SCHEME }}
      MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
      MICROSOFT_SIGNATURE_HASH: ${{ vars.MICROSOFT_SIGNATURE_HASH }}
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENABLED: ${{ vars.SENTRY_ENABLED }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ inputs.upload == 'false' && 'true' || 'false' }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      FEATURE_FLAG_URL: ${{ vars.FEATURE_FLAG_URL }}
      FEATURE_FLAG_SECRET: ${{ secrets.FEATURE_FLAG_SECRET }}
      CLANG: clang
      CLANGPLUSPLUS: clang++
      LD: clang
      LDPLUSPLUS: clang++

    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
          cache-dependency-path: dev-client/package-lock.json

      - name: Install Node dependencies
        working-directory: dev-client
        run: npm ci

      - name: Generate ios directory
        working-directory: dev-client
        run: npm run prebuild -- -p ios

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: dev-client

      # yukiarrr/ios-build-action@v1.13.0 internally runs `brew install fastlane`.
      # On the xcode-27 runner (macOS Tahoe) Homebrew's fastlane pulls in
      # Ruby 4.0.6 as a dependency, and Ruby 4 dropped `bigdecimal` (and a
      # few other gems) from stdlib — fastlane 2.239.x still requires them,
      # so it crashes on startup with `Gem::MissingSpecError`.
      # Do the brew install ourselves here, then gem-install the missing
      # stdlib refugees into Ruby 4's path. yukiarrr's later brew step then
      # finds fastlane already installed and no-ops. Delete this whole step
      # once either (a) yukiarrr publishes a version that manages its own
      # Ruby version, or (b) Homebrew fastlane starts declaring its stdlib
      # gems explicitly.
      - name: Prep fastlane for Ruby 4 (bigdecimal / nkf / …)
        run: |
          brew install fastlane
          RUBY_GEM="$(brew --prefix ruby)/bin/gem"
          # fastlane's GEM_PATH is hard-set to `~/.local/share/fastlane/4.0.0`
          # + its own Cellar libexec; anywhere else (e.g. Ruby 4's default
          # system gem dir) is invisible to it. Install our stdlib refugees
          # directly into fastlane's expected home so it can find them.
          FASTLANE_HOME="$HOME/.local/share/fastlane/4.0.0"
          mkdir -p "$FASTLANE_HOME"
          "$RUBY_GEM" install --install-dir "$FASTLANE_HOME" --no-document \
            bigdecimal nkf abbrev fiddle mutex_m ostruct digest-crc rbs

      - name: Build iOS App
        uses: yukiarrr/ios-build-action@v1.13.0
        with:
          project-path: dev-client/ios/LandPKSSoilID.xcodeproj
          p12-base64: ${{ secrets.APPLE_P12_BASE64 }}
          mobileprovision-base64: ${{ secrets.APPLE_MOBILE_PROVISION_BASE64 }}
          code-signing-identity: "iPhone Distribution"
          team-id: ${{ vars.APPLE_TEAM_ID }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          workspace-path: dev-client/ios/LandPKSSoilID.xcworkspace
          scheme: LandPKSSoilID

      - name: Upload app to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        if: ${{ inputs.upload == 'true' }}
        with:
          app-path: "output.ipa"
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_APP_STORE_CONNECT_PRIVATE_KEY }}
